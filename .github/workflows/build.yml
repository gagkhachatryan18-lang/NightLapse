name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: App icon
        shell: bash
        run: |
          D=NightLapse/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$D"
          printf '%s' '{"info":{"author":"xcode","version":1}}' > NightLapse/Assets.xcassets/Contents.json
          base64 -D < icon/icon.b64 > /tmp/icon.jpg
          sips -s format png -z 1024 1024 /tmp/icon.jpg --out "$D/AppIcon.png"
          printf '%s' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$D/Contents.json"
          ls -la "$D"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build NightLapse
        id: b1
        continue-on-error: true
        shell: bash
        run: |
          xcodebuild -project NightLapse.xcodeproj -scheme NightLapse \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build1.log

      - name: Build Watch app
        id: bw
        continue-on-error: true
        shell: bash
        run: |
          xcodebuild -project NightLapse.xcodeproj -target NightLapseWatch \
            -configuration Release -sdk watchos SYMROOT="$PWD/buildw" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee buildw.log
          ls buildw/Release-watchos || true

      - name: Symbolicate crash
        if: always()
        shell: bash
        run: |
          P=build/Build/Products/Release-iphoneos
          B=$P/NightLapse.app/NightLapse
          ls $P
          echo "::warning::UUID $(dwarfdump --uuid $B | tr '\n' ' ')"
          D=$P/NightLapse.app.dSYM
          T=$B; [ -d "$D" ] && T=$D/Contents/Resources/DWARF/NightLapse
          for a in 0x56890 0x561e4 0xf869c; do
            r=$(atos -o $T -arch arm64 -l 0x100000000 $(printf '0x%x' $((0x100000000 + a))) 2>&1)
            echo "::warning::$a => $r"
          done
          nm -n $B | swift demangle | awk '{print}' > syms.txt || true
          for a in 0x56890 0x561e4 0xf869c; do
            v=$((0x100000000 + a))
            best=$(awk -v v=$v '{ x=strtonum("0x"$1); if (x<=v) l=$0; else {print l; exit} }' syms.txt)
            echo "::warning::nm $a => $best"
          done

      - name: Package IPA
        if: always()
        shell: bash
        run: |
          mkdir -p out
          APP="build/Build/Products/Release-iphoneos/NightLapse.app"
          if [ -d "$APP" ]; then
            rm -rf Payload
            mkdir Payload
            cp -R "$APP" Payload/
            zip -qr out/NightLapse.ipa Payload
            # Отдельный файл с приложением для часов: если с часами не поставится, основной остаётся как был
            W="buildw/Release-watchos/NightLapseWatch.app"
            if [ -d "$W" ]; then
              mkdir -p Payload/NightLapse.app/Watch
              cp -R "$W" Payload/NightLapse.app/Watch/
              # Sideloadly меняет id приложения на com.gagik.nightlapse.899CHHP2NL (бесплатный Apple ID).
              # Часы ищут телефонное приложение по этому id - прописываем сразу его
              P=Payload/NightLapse.app/Watch/NightLapseWatch.app/Info.plist
              /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier com.gagik.nightlapse.899CHHP2NL" "$P"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.gagik.nightlapse.899CHHP2NL.watchkitapp" "$P"
              /usr/libexec/PlistBuddy -c "Print" "$P" | grep -i bundle
              zip -qr out/NightLapse_watch.ipa Payload
            fi
          fi
          ls -la out

      - name: Errors summary
        if: always()
        shell: bash
        run: |
          echo '### Ошибки сборки (если есть)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -h "error:" build1.log buildw.log 2>/dev/null | sort -u | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Те же ошибки отметками (annotations): их видно через API, даже когда логи недоступны
          grep -h "error:" build1.log buildw.log 2>/dev/null | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: out/*.ipa

      - name: Fail if build failed
        if: steps.b1.outcome == 'failure'
        run: exit 1
