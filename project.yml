name: NightLapse
options:
  bundleIdPrefix: com.gagik
  deploymentTarget:
    iOS: "17.0"
targets:
  NightLapse:
    type: application
    platform: iOS
    sources: [NightLapse, DailyFrame, Shared]
    dependencies:
      - target: NightLapseWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gagik.nightlapse
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NightLapse/Info.plist
      properties:
        CFBundleDisplayName: NightLapse
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Съёмка найтлапса и кадра дня"
        NSPhotoLibraryAddUsageDescription: "Сохранение видео и копий кадров в Фото"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSupportsLiveActivities: true
  NightLapseWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gagik.nightlapse.status
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: NightLapse
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
